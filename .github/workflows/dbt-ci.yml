name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dbt
        run: pip install "dbt-bigquery>=1.12,<1.13"

      - name: Check Python scripts compile
        run: python -m compileall -q data_generation ingestion monitoring

      - name: Validate dbt project (parse)
        working-directory: dbt_project
        env:
          GCP_PROJECT_ID: ci-placeholder
        run: dbt parse --profiles-dir .
